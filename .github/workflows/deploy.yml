# Builds the site from the problems/, glossary/ and puzzles/ folders and publishes it to GitHub Pages
# on every push to main. In the repository's Settings → Pages, set
# "Source" to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect problems, glossary and puzzles
        run: node build.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      # Runs after publishing so a typo never blocks the site from updating,
      # but still marks the run with a red ✗ (and emails you) if something's wrong.
      - name: Check problems
        run: node tests/check.js
